    <script>
        /*Que 14: 
Write a program to find the smallest digit in a given number using a while loop.

Input: 
    Enter a number : 53142
Output: 
    Smallest number is : 1
    */
        let num = parseInt(prompt("Enter Number"));
        let temp = num;
        let small = -1;
        while (temp > 0) {
            let digit = temp % 10;
            small = digit;

            if (digit < small) {
                small = digit;
            }
            temp = parseInt(temp / 10);
        }
alert(small+" is  the Smallest Digit in "+num);
    </script>
