<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /*Que 8 :
Write a  program to find the alternate digit sum is same or not.
Example number is : 12345
        1+3+5=9
        2+4=6
Output as: 
    Alternate digit sum is not same.
input:
    Enter a number : 12122
Output as : 
    Alternate digit sum is same.*/
        let num = parseInt(prompt("Enter number"));
        let temp = num;
        let sum1 = 0;
        let sum2 = 0;
        let position = 1;
        while (temp != 0) {
            let digit = temp % 10;
            if (position % 2 != 0) {
                sum1 += digit;
            } else {
                sum2 += digit;
            }
            temp = parseInt(temp / 10);
            position++;
        }

        if (sum1 == sum2) {
            alert("Alternate digit sum is same");
        } else {
            alert("Alternate digit sum is not a same");
        }


    </script>
