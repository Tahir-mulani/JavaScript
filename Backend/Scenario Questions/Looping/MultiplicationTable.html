    <script>
        /*Write a program that takes a number and prints its multiplication table using a while loop.

Sample Input:
	Enter a number: 7
Sample Output:
7 x 1 = 7
7 x 2 = 14
7 x 3 = 21
.
.
.
7 x 9 = 63
7 x 10 = 70
*/

let num = parseInt(prompt("Enter Number"));
let i=1;
while(i < 11){
 alert(num +" x "+i+" = "+(i*num));
 i++;
}
alert("Thank you...!")
    </script>
