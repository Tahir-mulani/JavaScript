    <script>
        /*Que 11 :
-------
Write a program to keep adding the digits of a number until the result is a single digit, using a while loop.
example number is : 9876
Explanation: 9 + 8 + 7 + 6 = 30 
       → 3 + 0 = 3

Input: 
    Enter a number : 12345
Output: 
    Result is : 6*/
    let num = parseInt(prompt("Enter Number"));
   
    while(num >= 10){
         let sum =0;
         while(num > 0){
            let digit = num %10;
            sum += digit;
            num = parseInt(num/10);
         }
         num =sum;
    }
    alert("Result is "+num);
    </script>
