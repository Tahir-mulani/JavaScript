    <script>
        /*Que 10 :
    -------
    Write a  program that prints all odd numbers between two given integers a and b using a while loop.
    
    Input:
        Enter Two number : 3 15
    Output:
        The odd numbers between a and b : 3 5 7 9 11 13 15*/
        let num1 = parseInt(prompt("Enter First Number"));
        let num2 = parseInt(prompt("Enter Second Number"));
        let oddNumers ="";
        while(num1 <= num2){
            if(num1%2 != 0){
                oddNumers += String(num1+" ");
            }
            num1++;
        }
        alert(oddNumers);
    </script>
